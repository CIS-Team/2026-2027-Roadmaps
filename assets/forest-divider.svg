<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <g id="p">
      <polygon points="0,-100 -20,-62 20,-62"/>
      <polygon points="0,-78 -28,-32 28,-32"/>
      <polygon points="0,-52 -36,4 36,4"/>
      <rect x="-4" y="4" width="8" height="12"/>
    </g>
    <radialGradient id="g">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9e73" stop-opacity="0"/>
      <stop offset=".15" stop-color="#2f9e73"/>
      <stop offset=".85" stop-color="#2f9e73"/>
      <stop offset="1" stop-color="#2f9e73" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- the vine that draws itself -->
  <path d="M0,46 C90,34 150,58 250,46 S400,34 500,46 S650,58 750,46 S910,34 1000,46" fill="none" stroke="url(#fade)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1100" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="1100" to="0" dur="3.5s" fill="freeze"/>
  </path>

  <!-- tiny pines -->
  <g fill="#2f9e73" opacity=".9">
    <use href="#p" transform="translate(120 48) scale(.22)"/>
    <use href="#p" transform="translate(172 47) scale(.32)"/>
    <use href="#p" transform="translate(222 46) scale(.2)"/>
    <use href="#p" transform="translate(338 46) scale(.17)"/>
    <use href="#p" transform="translate(662 47) scale(.17)"/>
    <use href="#p" transform="translate(778 46) scale(.2)"/>
    <use href="#p" transform="translate(828 47) scale(.32)"/>
    <use href="#p" transform="translate(880 48) scale(.22)"/>
  </g>
  <g fill="#1c7a58">
    <use href="#p" transform="translate(145 48) scale(.15)"/>
    <use href="#p" transform="translate(850 48) scale(.15)"/>
  </g>

  <!-- centre emblem: a seed between two leaves -->
  <circle cx="500" cy="46" r="16" fill="url(#g)">
    <animate attributeName="r" values="12;20;12" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M494,47 C484,38 470,40 464,48 C474,56 488,56 494,47Z" fill="#52b788"/>
  <path d="M506,47 C516,38 530,40 536,48 C526,56 512,56 506,47Z" fill="#52b788"/>
  <circle cx="500" cy="46" r="4.5" fill="#f3c969"/>

  <!-- fireflies -->
  <g transform="translate(300 30)"><circle r="5" fill="url(#g)"><animateMotion dur="7s" repeatCount="indefinite" path="M0,0 C14,-14 30,-6 34,6 S12,18 0,0"/><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(430 24)"><circle r="5" fill="url(#g)"><animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M0,0 C-14,-8 -26,6 -12,16 S12,10 0,0"/><animate attributeName="opacity" values="1;.1;1" dur="4s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(580 26)"><circle r="5" fill="url(#g)"><animateMotion dur="8s" begin="-2s" repeatCount="indefinite" path="M0,0 C14,-14 30,-6 34,6 S12,18 0,0"/><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(720 28)"><circle r="5" fill="url(#g)"><animateMotion dur="10s" begin="-6s" repeatCount="indefinite" path="M0,0 C-14,-8 -26,6 -12,16 S12,10 0,0"/><animate attributeName="opacity" values="1;.1;1" dur="3.8s" repeatCount="indefinite"/></circle></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
