<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Your Path Through the Forest</title>
  <desc id="d">A winding trail with six stops: choose your track, learn the fundamentals, practice and apply, build real projects, review and improve, keep growing.</desc>
  <style>
    .t{font:700 16px Georgia,'Times New Roman',serif;fill:#fff4d1;text-anchor:middle}
    .s{font:italic 13px Georgia,'Times New Roman',serif;fill:#9fd8bb;text-anchor:middle}
    .e{font-size:24px;text-anchor:middle}
    @keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(1.8);opacity:0}}
    .pl{animation:pulse 3.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04211c"/>
      <stop offset="1" stop-color="#0b3a2e"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a36b"/>
      <stop offset="1" stop-color="#7ddf9c"/>
    </linearGradient>
    <radialGradient id="g">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".3" stop-color="#ffe08a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <circle id="fly" r="9" fill="url(#g)"/>
    <g id="pine">
      <polygon points="0,-100 -20,-62 20,-62"/>
      <polygon points="0,-78 -28,-32 28,-32"/>
      <polygon points="0,-52 -36,4 36,4"/>
      <rect x="-4" y="4" width="8" height="12"/>
    </g>
    <path id="path" d="M110,420 C195,420 195,300 280,300 C365,300 365,400 450,400 C540,400 540,260 630,260 C715,260 715,350 800,350 C865,350 835,170 900,170"/>
  </defs>

  <rect width="1000" height="540" rx="24" fill="url(#bg)"/>

  <!-- background pines -->
  <g fill="#0a3d31" opacity=".55">
    <use href="#pine" transform="translate(40 540) scale(1.6)"/>
    <use href="#pine" transform="translate(130 540) scale(1.1)"/>
    <use href="#pine" transform="translate(240 540) scale(1.3)"/>
    <use href="#pine" transform="translate(350 540) scale(.9)"/>
    <use href="#pine" transform="translate(540 540) scale(1.2)"/>
    <use href="#pine" transform="translate(650 540) scale(.9)"/>
    <use href="#pine" transform="translate(740 540) scale(1.4)"/>
    <use href="#pine" transform="translate(850 540) scale(1)"/>
    <use href="#pine" transform="translate(960 540) scale(1.6)"/>
  </g>

  <text x="500" y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" letter-spacing="7" fill="#fff4d1">YOUR PATH THROUGH THE FOREST</text>

  <!-- the trail -->
  <path d="M110,420 C195,420 195,300 280,300 C365,300 365,400 450,400 C540,400 540,260 630,260 C715,260 715,350 800,350 C865,350 835,170 900,170" fill="none" stroke="#c9a36b" stroke-width="12" stroke-linecap="round" stroke-opacity=".18"/>
  <path d="M110,420 C195,420 195,300 280,300 C365,300 365,400 450,400 C540,400 540,260 630,260 C715,260 715,350 800,350 C865,350 835,170 900,170" fill="none" stroke="url(#trail)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" from="180" to="0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- a lantern that walks the trail -->
  <use href="#fly"><animateMotion dur="16s" repeatCount="indefinite"><mpath href="#path"/></animateMotion></use>

  <!-- 1 -->
  <g transform="translate(110 420)">
    <circle class="pl" r="26" fill="none" stroke="#c9a36b" stroke-width="2"/>
    <circle r="26" fill="#06251f" stroke="#c9a36b" stroke-width="3"/>
    <text class="e" y="9">🌰</text>
    <text class="t" y="62">1 · Choose your track</text>
    <text class="s" y="82">Find the trail calling you</text>
  </g>
  <!-- 2 -->
  <g transform="translate(280 300)">
    <circle class="pl" r="26" fill="none" stroke="#a9c86a" stroke-width="2" style="animation-delay:-.6s"/>
    <circle r="26" fill="#06251f" stroke="#a9c86a" stroke-width="3"/>
    <text class="e" y="9">🌱</text>
    <text class="t" y="-58">2 · Learn the fundamentals</text>
    <text class="s" y="-38">Roots first, branches later</text>
  </g>
  <!-- 3 -->
  <g transform="translate(450 400)">
    <circle class="pl" r="26" fill="none" stroke="#8fd694" stroke-width="2" style="animation-delay:-1.2s"/>
    <circle r="26" fill="#06251f" stroke="#8fd694" stroke-width="3"/>
    <text class="e" y="9">🌿</text>
    <text class="t" y="62">3 · Practice &amp; apply</text>
    <text class="s" y="82">Water it every single day</text>
  </g>
  <!-- 4 -->
  <g transform="translate(630 260)">
    <circle class="pl" r="26" fill="none" stroke="#7ddf9c" stroke-width="2" style="animation-delay:-1.8s"/>
    <circle r="26" fill="#06251f" stroke="#7ddf9c" stroke-width="3"/>
    <text class="e" y="9">🌳</text>
    <text class="t" y="-58">4 · Build real projects</text>
    <text class="s" y="-38">Turn knowledge into shelter</text>
  </g>
  <!-- 5 -->
  <g transform="translate(800 350)">
    <circle class="pl" r="26" fill="none" stroke="#6fe0b0" stroke-width="2" style="animation-delay:-2.4s"/>
    <circle r="26" fill="#06251f" stroke="#6fe0b0" stroke-width="3"/>
    <text class="e" y="9">🍃</text>
    <text class="t" y="62">5 · Review &amp; improve</text>
    <text class="s" y="82">Prune, refine, repeat</text>
  </g>
  <!-- 6 -->
  <g transform="translate(900 170)">
    <circle class="pl" r="26" fill="none" stroke="#f3d28b" stroke-width="2" style="animation-delay:-3s"/>
    <circle r="26" fill="#06251f" stroke="#f3d28b" stroke-width="3"/>
    <text class="e" y="9">🌲</text>
    <text class="t" y="-58">6 · Keep growing</text>
    <text class="s" y="-38">Growth never stops</text>
  </g>

  <!-- fireflies -->
  <g transform="translate(200 200)"><use href="#fly"><animateMotion dur="10s" repeatCount="indefinite" path="M0,0 C18,-26 46,-22 56,6 S28,36 0,0"/><animate attributeName="opacity" values=".1;1;.1" dur="4s" repeatCount="indefinite"/></use></g>
  <g transform="translate(520 150)"><use href="#fly"><animateMotion dur="12s" begin="-4s" repeatCount="indefinite" path="M0,0 C-22,-18 -40,8 -20,26 S20,20 0,0"/><animate attributeName="opacity" values="1;.1;1" dur="5s" repeatCount="indefinite"/></use></g>
  <g transform="translate(720 450)"><use href="#fly"><animateMotion dur="11s" begin="-2s" repeatCount="indefinite" path="M0,0 C30,-10 44,-34 16,-40 S-26,-12 0,0"/><animate attributeName="opacity" values=".2;1;.2" dur="3.8s" repeatCount="indefinite"/></use></g>
  <g transform="translate(350 470)"><use href="#fly"><animateMotion dur="13s" begin="-6s" repeatCount="indefinite" path="M0,0 C18,-26 46,-22 56,6 S28,36 0,0"/><animate attributeName="opacity" values="1;.2;1" dur="4.4s" repeatCount="indefinite"/></use></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
